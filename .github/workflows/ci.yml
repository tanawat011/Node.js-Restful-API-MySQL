name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [24, 26]
    services:
      mysql:
        image: mysql:8.4.13
        # Throwaway container that lives only for this job.
        env:
          MYSQL_ROOT_PASSWORD: ci-only-root
          MYSQL_DATABASE: inform_repair_test
          MYSQL_USER: app
          MYSQL_PASSWORD: ci-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pci-only-root --silent"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_USER: app
      DB_PASSWORD: ci-only
      TEST_DB_NAME: inform_repair_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=low
      - name: npm test (fails if a database test was skipped)
        run: |
          set -o pipefail
          npm test 2>&1 | tee test.log
          grep -qE '(ℹ|#) skipped 0$' test.log
